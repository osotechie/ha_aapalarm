[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP041", "RUF012", "RUF059", "SIM102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx --disable-socket --allow-unix-socket"
pythonpath = ["."]
testpaths = ["tests"]
