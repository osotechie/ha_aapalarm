name: Lint & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install latest Ruff
        run: python -m pip install --upgrade ruff
      - name: Ruff lint
        run: python -m ruff check custom_components/aapalarm tests
      - name: Ruff formatting
        run: python -m ruff format --check custom_components/aapalarm tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v --tb=short --junitxml=test-results.xml
